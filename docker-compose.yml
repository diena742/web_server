services:
  dashboard:
    build: .
    image: eka-dashboard:latest
    container_name: eka_dashboard
    restart: unless-stopped
    # Use standard bridge mode with port mapping to enforce Port 80
    ports:
      - "${DASHBOARD_PORT:-80}:5000"
    pid: host # Essential for Process List
    privileged: true # Essential for low-level hardware access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker Management
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket # Systemd Control
      - /proc:/host/proc:ro # Hardware Stats
      - /sys:/host/sys:ro # Hardware Stats
      - /:/host/root # File Manager Access
      - /etc/wireguard:/etc/wireguard # Manage WireGuard Config
      - ./data:/app/data # Persist configs/license
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ROOT=/host/root
      # Secrets belong in the untracked .env file, never in this YAML.
      - SECRET_KEY=${SECRET_KEY:-}
      - MOBILE_ACCESS_TOKEN=${MOBILE_ACCESS_TOKEN:-}
      - DASHBOARD_ALLOWED_ORIGINS=${DASHBOARD_ALLOWED_ORIGINS:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Lax}
      - FILES_READONLY_ROOTS=${FILES_READONLY_ROOTS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
